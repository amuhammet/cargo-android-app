name: Cargo Android App CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest  # ✅ ubuntu-24.04 → ubuntu-latest (Node 24 guaranteed)

    permissions:
      contents: read
      checks: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.3  # ✅ v4.2.3+ Node 24 compatible patch
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5  # ✅ v4 → v5 (FIXED)
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        cache-dependency-path: |
          **/build.gradle
          **/gradle-wrapper.properties

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Validate Gradle Wrapper
      run: ./gradlew wrapper --gradle-version 8.11.1

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace --info
      continue-on-error: true

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x test --stacktrace --info

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4.5.1  # ✅ v4.5.1+ Node 24 patch
      if: always()
      with:
        name: cargo-debug-apk
        path: app/build/outputs/apk/debug/**/*.apk
        if-no-files-found: warn
        retention-days: 7
        compression-level: 6

    - name: Build Report
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Time: $(date)" >> $GITHUB_STEP_SUMMARY
