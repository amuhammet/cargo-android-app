name: Cargo Android App CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-24.04  # ✅ Ubuntu 24.04 = Node 24 native support

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4  # ✅ v4 (latest, Node 24 compatible)
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4  # ✅ v4 (latest)
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --stacktrace
      continue-on-error: true  # Test başarısız olsa bile devam et

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x test --stacktrace

    - name: Build Release APK (Optional)
      run: ./gradlew assembleRelease -x test --stacktrace
      continue-on-error: true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: cargo-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        retention-days: 7

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cargo-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: ignore
        retention-days: 30

    - name: Build Status
      run: echo "✅ Build completed successfully"
      if: success()
