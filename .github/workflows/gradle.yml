name: Cargo Android App CI

# Hangi durumlarda bu iş akışının tetikleneceğini belirliyoruz
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Test App
    runs-on: ubuntu-latest

    steps:
    # 1. Adım: Depodaki kaynak kodları CI ortamına klonla
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Adım: Java 17 ortamını kur (Modern Android Gradle pluginleri için gereklidir)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Adım: Gradle çalıştırma betiğine (gradlew) çalıştırma yetkisi ver
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # 4. Adım: Projedeki birim (Unit) testlerini koştur
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    # 5. Adım: Uygulamayı derle ve hata ayıklama (Debug) APK'sını üret
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 6. Adım: Üretilen APK dosyasını GitHub Actions paneline indirilebilir çıktı olarak yükle
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cargo-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 7
