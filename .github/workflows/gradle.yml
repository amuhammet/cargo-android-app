name: Build and Test App

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest  # ✅ Node 24 native (Oct 19, 2026 geçişi)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1  # ✅ v7.0.1 (Node 24)
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5  # ✅ v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build -v
    
    - name: Run unit tests
      run: ./gradlew test
    
    - name: Upload build reports
      uses: actions/upload-artifact@v7.0.2  # ✅ v7.0.2 (Node 24)
      if: always()
      with:
        name: build-reports
        path: |
          app/build/reports/
        retention-days: 7
    
    - name: Upload APK artifacts
      uses: actions/upload-artifact@v7.0.2  # ✅ v7.0.2
      if: success()
      with:
        name: apk-outputs
        path: app/build/outputs/apk/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Run Android Lint
      run: ./gradlew app:lintDebug app:lintRelease
    
    - name: Upload lint results
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint/
