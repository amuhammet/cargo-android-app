// ✅ Root Level Build File - Android Cargo App
plugins {
    id 'com.android.application' version '8.7.2' apply false  // ✅ AGP 8.7.2
    id 'com.android.library' version '8.7.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false  // ✅ Kotlin 2.0.21
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false

    // ✅ Hilt + Dependency Injection
    id 'com.google.dagger.hilt.android' version '2.51.1' apply false

    // ✅ Navigation Safe Args
    id 'androidx.navigation.safeargs.kotlin' version '2.8.0' apply false
}



// ✅ Test configuration
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
